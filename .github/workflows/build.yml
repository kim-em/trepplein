on:
  pull_request:
  push:
    branches:
      - '*'
    tags:
      - '*'

name: ci

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt compile

      - name: Download arena tests
        run: ./scripts/download-arena-tests.sh

      - name: Run tests
        run: sbt test

      - name: Create release zip
        run: sbt universal:packageBin

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/universal/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  init-test:
    name: Init Library Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install elan
        run: |
          curl https://elan-init.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Generate Init export
        # Note: nightly-2026-01-23+ has a regression we haven't diagnosed yet
        # (Char.succ?_eq fails type checking). Using known working nightly.
        run: LEAN_NIGHTLY=2026-01-22 ./scripts/generate-init-export.sh

      - name: Run Init test
        run: sbt -J-Xss100m -J-Xmx8g "testOnly *InitExportTest"

  std-test:
    name: Std Library Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install elan
        run: |
          curl https://elan-init.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Generate Std export
        run: ./scripts/generate-std-export.sh

      - name: Run Std test
        run: sbt -J-Xss100m -J-Xmx8g "testOnly *StdExportTest"

  batteries-test:
    name: Batteries Library Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Install elan
        run: |
          curl https://elan-init.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Generate Batteries export
        run: ./scripts/generate-batteries-export.sh

      - name: Run Batteries test
        run: sbt -J-Xss100m -J-Xmx8g "testOnly *BatteriesExportTest"
